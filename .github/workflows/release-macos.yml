name: Release macOS App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install root dependencies
        run: npm ci

      - name: Build frontend
        run: |
          cd client
          npm ci
          npm run build

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci --omit=dev

      - name: Prebuild reference data (routes.db, aircraft.csv.gz, standing-data)
        run: node backend/scripts/prebuild-electron-data.mjs

      - name: Rebuild better-sqlite3 for Electron (${{ matrix.arch }})
        run: |
          ELECTRON_VERSION=$(node -p "require('./package.json').devDependencies.electron.replace('^','')")
          npx @electron/rebuild \
            --version "$ELECTRON_VERSION" \
            --arch ${{ matrix.arch }} \
            --module-dir backend \
            --only better-sqlite3

      - name: Stage backend-seed/
        run: node electron/util/stage-backend-seed.mjs

      - name: Build DMG (${{ matrix.arch }})
        run: npx electron-builder --mac --${{ matrix.arch }} --publish never --config electron-builder.yml

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: dist-electron/*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all DMGs
        uses: actions/download-artifact@v4
        with:
          path: dist-electron
          pattern: dmg-*
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist-electron/*.dmg \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
